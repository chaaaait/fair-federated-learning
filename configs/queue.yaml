# Experiment queue (PLAN §4). The sweep runs blocks top to bottom, skips finished runs,
# and re-reads this file before every run: edit eps0 (Gate 2) and later runs pick it up.
# Run IDs do not include the block, so a configuration shared by two blocks runs once.

eps0: 2.0                # Gate 2: confirm after Q1+Q2 (DP-FedAvg still learns but loses >= 5 points)
seeds: [0, 1, 2]

blocks:
  - name: Q1             # M1 privacy sweep (FedAvg + fine-tuning from one run)
    dataset: cifar10
    eps: [inf, 8, 4, 2, 1, 0.5, 0.3]
    runs:
      - {method: fedavg}

  - name: Q2             # non-private ceilings for the other mechanisms
    dataset: cifar10
    eps: [inf]
    runs:
      - {method: local}
      - {method: perfedavg}
      - {method: ifca}
      - {method: fedper}

  - name: Q3             # M2 core: all mechanisms at the common budget eps0
    dataset: cifar10
    eps: [eps0]
    runs:
      - {method: local}
      - {method: perfedavg}
      - {method: ifca}
      - {method: fedper}

  - name: Q4             # M3: q-FFL on the global model (q = 0 is plain FedAvg from Q1)
    dataset: cifar10
    eps: [eps0, inf]
    runs:
      - {method: fedavg, aggregation: qffl, qffl_q: 1}
      - {method: fedavg, aggregation: qffl, qffl_q: 5}

  - name: Q5             # Adult: group fairness (DP / EO gaps by sex)
    dataset: adult
    eps: [inf, eps0]
    runs:
      - {method: fedavg}
      - {method: local}
      - {method: perfedavg}
      - {method: ifca}
      - {method: fedper}

  - name: Q6             # M2 full sweep
    dataset: cifar10
    eps: [8, 4, 1, 0.5]
    runs:
      - {method: local}
      - {method: perfedavg}
      - {method: ifca}
      - {method: fedper}

  - name: Q7             # extras: q-FFL + best mechanism (default FedPer; change after Q3), heterogeneity check
    dataset: cifar10
    eps: [eps0]
    runs:
      - {method: fedper, aggregation: qffl, qffl_q: 1}
      - {method: fedper, aggregation: qffl, qffl_q: 5}
      - {method: fedavg, dirichlet_alpha: 1.0}
      - {method: fedper, dirichlet_alpha: 1.0}

  # ---- First-level review (Dr Kalaavathi B, 25 Oct 2026) ----------------------------------------------------
  - name: Q8             # review item 2: tune the q-FedAvg constant L = s / lr (s = 1 is Q4); same 40 rounds
    dataset: cifar10
    eps: [eps0, inf]
    runs:
      - {method: fedavg, aggregation: qffl, qffl_q: 1, qffl_L_scale: 0.01}
      - {method: fedavg, aggregation: qffl, qffl_q: 1, qffl_L_scale: 0.1}
      - {method: fedavg, aggregation: qffl, qffl_q: 1, qffl_L_scale: 10}
      - {method: fedavg, aggregation: qffl, qffl_q: 1, qffl_L_scale: 100}

  - name: Q9             # review item 1: non-private baselines trained to convergence (5x the 40-round budget)
    dataset: cifar10
    eps: [inf]
    runs:
      - {method: fedavg, rounds: 200}
      - {method: fedper, rounds: 200}
      - {method: local, rounds: 200}
      - {method: perfedavg, rounds: 200}
      - {method: ifca, rounds: 200}

  - name: Q10            # review item 1: Adult non-private baselines to convergence (Per-FedAvg still rising at 30)
    dataset: adult
    eps: [inf]
    runs:
      - {method: fedavg, rounds: 100}
      - {method: local, rounds: 100}
      - {method: perfedavg, rounds: 100}
      - {method: ifca, rounds: 100}
      - {method: fedper, rounds: 100}

  - name: Q11            # review items 1+2: converged non-private q-FFL (default L) for the M3 comparison
    dataset: cifar10
    eps: [inf]
    runs:
      - {method: fedavg, aggregation: qffl, qffl_q: 1, rounds: 200}
      - {method: fedavg, aggregation: qffl, qffl_q: 5, rounds: 200}
